[package]
name = "crossplane-forge"
version = "0.1.1"
edition = "2024"
rust-version = "1.89.0"
description = "Crossplane CRD generator from IaC forge IR"
homepage = "https://github.com/pleme-io/crossplane-forge"
repository = "https://github.com/pleme-io/crossplane-forge"
documentation = "https://docs.rs/crossplane-forge"
readme = "README.md"
license = "MIT"
categories = ["development-tools"]
keywords = ["crossplane", "kubernetes", "crd", "codegen"]

[lints.clippy]
pedantic = "warn"

[dependencies]
iac-forge = "0.1"
go-synthesizer = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2.0.18"
toml = "0.8"


[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
